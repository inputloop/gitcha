# preseed.example.cfg -- answers to every debconf question the Gitcha packages ask, for unattended installs.
# Copyright 2026 Bryant Frankford <nathanielfrankford@gmail.com> and Corwin Brust <corwin@bru.st> and Contributors.
# SPDX-License-Identifier: GPL-3.0-or-later OR LGPL-3.0-or-later
#
# On one host:   debconf-set-selections preseed.cfg && DEBIAN_FRONTEND=noninteractive apt-get install -y inputloop-gitcha
# On many:       sh deploy/mass-install.sh hosts.txt preseed.cfg ...   (replaces @HOST@ and @INSTANCE@ per host)
# Lines for a package that is not being installed are harmless.  The format is: package question type value.

# ---- inputloop-gitcha (the server) ----
inputloop-gitcha inputloop-gitcha/public_url string https://@HOST@.gitcha.example.org
inputloop-gitcha inputloop-gitcha/hosting_domains string
# cassandra or file
inputloop-gitcha inputloop-gitcha/store select cassandra
# true: install Apache Cassandra on each host after Gitcha (one local node; the contact point questions are then skipped)
inputloop-gitcha inputloop-gitcha/cassandra_setup boolean false
inputloop-gitcha inputloop-gitcha/cassandra_contact_points string cass1.example.org,cass2.example.org,cass3.example.org
inputloop-gitcha inputloop-gitcha/cassandra_datacenter string datacenter1
inputloop-gitcha inputloop-gitcha/cassandra_keyspace string gitcha
# One name per Gitcha server sharing the keyspace; mass-install.sh fills in the hosts file's second column, or the host.
inputloop-gitcha inputloop-gitcha/cassandra_instance string @INSTANCE@
inputloop-gitcha inputloop-gitcha/cassandra_replication string NetworkTopologyStrategy:datacenter1=3
inputloop-gitcha inputloop-gitcha/cassandra_username string
inputloop-gitcha inputloop-gitcha/cassandra_password password
inputloop-gitcha inputloop-gitcha/enable boolean true

# ---- inputloop-gitcha-runner ----
inputloop-gitcha-runner inputloop-gitcha-runner/server_url string https://gitcha.example.org
# A registration token made with "uses" of at least the number of runners registers the whole fleet.
inputloop-gitcha-runner inputloop-gitcha-runner/registration_token password
inputloop-gitcha-runner inputloop-gitcha-runner/name string @HOST@
inputloop-gitcha-runner inputloop-gitcha-runner/labels string
inputloop-gitcha-runner inputloop-gitcha-runner/enable boolean true

# ---- inputloop-gitcha-medic ----
# report (say only) or safe (also start a stopped service, restart a stuck one)
inputloop-gitcha-medic inputloop-gitcha-medic/heal select safe
# any of: syslog, tavern, chadgram, webhook, c4
inputloop-gitcha-medic inputloop-gitcha-medic/channels multiselect syslog, tavern
inputloop-gitcha-medic inputloop-gitcha-medic/tavern_agent_json string /var/lib/tavern/agent.json
inputloop-gitcha-medic inputloop-gitcha-medic/tavern_room string ops
inputloop-gitcha-medic inputloop-gitcha-medic/chadgram_file string /var/lib/gitcha-medic/chad.jsonl
inputloop-gitcha-medic inputloop-gitcha-medic/webhook_url string
inputloop-gitcha-medic inputloop-gitcha-medic/c4_dir string
# none, claude, local (TODO), inputloop (TODO), openai (TODO)
inputloop-gitcha-medic inputloop-gitcha-medic/agent select none
inputloop-gitcha-medic inputloop-gitcha-medic/agent_model string claude-opus-5-5
inputloop-gitcha-medic inputloop-gitcha-medic/agent_url string https://api.anthropic.com
# The key goes to /etc/inputloop/gitcha/agent.key (mode 600) and is not kept in debconf.
inputloop-gitcha-medic inputloop-gitcha-medic/agent_key password
inputloop-gitcha-medic inputloop-gitcha-medic/enable boolean true

# ---- inputloop-gitcha-omni-gateway ----
# Starts only when /etc/inputloop/omni/members.json is there (copy and edit omni-members.example.json first).
inputloop-gitcha-omni-gateway inputloop-gitcha-omni-gateway/enable boolean false
